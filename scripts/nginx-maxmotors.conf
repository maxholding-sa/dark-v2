# Nginx reverse proxy for Next.js (PM2 on port 3000)
# Install: bash scripts/vps-setup-domain.sh

upstream maxmotors_nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name maxmotors.sa www.maxmotors.sa;

    # 0 = no upload size limit
    client_max_body_size 0;

    location / {
        client_max_body_size 0;

        proxy_pass http://maxmotors_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
